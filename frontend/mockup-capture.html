<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreditMaxx screen capture</title>
  <style>
    .device-iphone-14.iphone { width: 402px !important; height: 874px !important; transform: scale(3) !important; }
    .device-iphone-14 .device-frame { width: 402px !important; height: 874px !important; padding: 0 !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
    .device-iphone-14 .device-screen { width: 402px !important; height: 874px !important; border-radius: 0 !important; --sat: 62px !important; --sab: 34px !important; }
    .device-iphone-14 > :not(.device-frame) { display: none; }
    .device-screen .status-bar { height: 62px; grid-template-columns: 1fr 130px 1fr; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
